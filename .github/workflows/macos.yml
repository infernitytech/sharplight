name: macOS and ARM64

# macOS (docs/macos.md): Apple Silicon through the bundled MoltenVK, the ARM64 (NEON) CPU kernels, and the Sharplight
# Studio .app bundle. Runs only for macos/* branches or by hand; main's workflows are unaffected.
#
# Runners are small (macos-15: 3 cores, 7 GB; ubuntu-24.04-arm: 4 cores, 16 GB), so the suites run with few threads and
# the LLM smoke test uses Qwen2.5-0.5B-Instruct Q4_K_M (0.5 GB).

on:
  push:
    branches: ['macos/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  SMOKE_MODEL_URL: https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf
  SMOKE_PROMPT: The capital of France is
  # Compiled kernels (per-user artifact store, FileCompilationCache) in a fixed place the kernel cache steps save and restore.
  SHARPLIGHT_COMPILATION_CACHE: ${{ github.workspace }}/.kernel-cache
  VULKAN_QUANT: -class Sharplight.Vulkan.Tests.QuantFormatTests -class Sharplight.Vulkan.Tests.BonsaiQuantTests -class Sharplight.Vulkan.Tests.Iq4QuantTests -class Sharplight.Vulkan.Tests.Fp8GemmTests -class Sharplight.Vulkan.Tests.MoeTests -class Sharplight.Vulkan.Tests.TopKTests -class Sharplight.Vulkan.Tests.PadTests -class Sharplight.Vulkan.Tests.ResizeTests
  VULKAN_MMQ: -class Sharplight.Vulkan.Tests.MmqTests
  METAL_ATTENTION: -class Sharplight.Vulkan.Tests.FullAttentionTests -class Sharplight.Vulkan.Tests.PagedAttentionTests -class Sharplight.Vulkan.Tests.SparseAttentionTests -class Sharplight.Vulkan.Tests.CompressedKvTests -class Sharplight.Vulkan.Tests.StateHandoffTests -class Sharplight.Vulkan.Tests.PackedSequenceTests
  VULKAN_CORE: -class Sharplight.Vulkan.Tests.ElementwiseTests -class Sharplight.Vulkan.Tests.NormTests -class Sharplight.Vulkan.Tests.RopeTests -class Sharplight.Vulkan.Tests.RowOpTests -class Sharplight.Vulkan.Tests.ReduceTests -class Sharplight.Vulkan.Tests.GatherTests -class Sharplight.Vulkan.Tests.ViewTests -class Sharplight.Vulkan.Tests.DataOpTests -class Sharplight.Vulkan.Tests.CastAndIntegerTests -class Sharplight.Vulkan.Tests.MatMulTests -class Sharplight.Vulkan.Tests.FusionTests -class Sharplight.Vulkan.Tests.SimtGemmTests -class Sharplight.Vulkan.Tests.SkinnyGemmTests -class Sharplight.Vulkan.Tests.SplitHalfGemmTests -class Sharplight.Vulkan.Tests.RowInvarianceTests -class Sharplight.Vulkan.Tests.StatefulTests

jobs:
  # The native Metal provider (docs/macos.md, src/Sharplight.Metal): unit tests, the GPU kernel suite of Sharplight.Vulkan.Tests run on the
  # Metal device (SHARPLIGHT_TEST_PROVIDER=metal, every graph against the CPU oracle), the LLM smoke test and a Metal / MoltenVK benchmark.
  metal:
    name: macOS arm64 (Metal)
    runs-on: macos-15
    timeout-minutes: 240
    env:
      SHARPLIGHT_COMPILATION_CACHE: ${{ github.workspace }}/.metal-kernel-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Host
        run: |
          sw_vers
          sysctl -n machdep.cpu.brand_string
          sysctl hw.ncpu hw.memsize
          system_profiler SPDisplaysDataType | grep -E 'Chipset|Metal|Cores|Vendor' || true

      - name: Build
        run: |
          dotnet build tests/Sharplight.Metal.Tests -c Release
          dotnet build tests/Sharplight.Vulkan.Tests -c Release
          dotnet build samples/Sharplight.Cli -c Release

      - name: Devices and features
        run: dotnet samples/Sharplight.Cli/bin/Release/net11.0/Sharplight.Cli.dll --devices

      - name: Metal unit tests
        run: dotnet tests/Sharplight.Metal.Tests/bin/Release/net11.0/Sharplight.Metal.Tests.dll -result-xml "$RUNNER_TEMP/metal-unit-tests.xml"

      - name: Restore the kernel cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.metal-kernel-cache
          key: macos-metal-kernels-${{ hashFiles('src/Sharplight.Shaders/Kernels/**', 'Directory.Packages.props') }}
          restore-keys: macos-metal-kernels-

      - name: Smoke model
        if: success() || failure()
        id: model
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/models/smoke.gguf" "$SMOKE_MODEL_URL"
          echo "path=$RUNNER_TEMP/models/smoke.gguf" >> "$GITHUB_OUTPUT"

      - name: LLM smoke test (Metal)
        if: (success() || failure()) && steps.model.outcome == 'success'
        timeout-minutes: 20
        env:
          SHARPLIGHT_LOAD_TIMING: 1
        run: |
          dotnet samples/Sharplight.Cli/bin/Release/net11.0/Sharplight.Cli.dll "${{ steps.model.outputs.path }}" --provider metal -p "$SMOKE_PROMPT" -n 32 | tee "$RUNNER_TEMP/smoke-metal.txt"
          grep -q Paris "$RUNNER_TEMP/smoke-metal.txt"

      - name: LLM benchmark (Metal against MoltenVK)
        if: (success() || failure()) && steps.model.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          cli=samples/Sharplight.Cli/bin/Release/net11.0/Sharplight.Cli.dll
          for provider in metal vulkan; do
            for tokens in 128 512; do
              echo "=== $provider --bench $tokens"
              dotnet $cli "${{ steps.model.outputs.path }}" --provider $provider --bench $tokens 2>&1 | grep -E 'dispatches|prefill [0-9]+ tok' || echo "(failed)"
            done
          done

      - name: Metal kernel suite, core
        if: success() || failure()
        timeout-minutes: 60
        env:
          SHARPLIGHT_TEST_PROVIDER: metal
        run: dotnet tests/Sharplight.Vulkan.Tests/bin/Release/net11.0/Sharplight.Vulkan.Tests.dll -maxThreads 2 -longRunning 300 -result-xml "$RUNNER_TEMP/metal-core-tests.xml" ${{ env.VULKAN_CORE }}

      - name: Metal kernel suite, attention
        if: success() || failure()
        timeout-minutes: 30
        env:
          SHARPLIGHT_TEST_PROVIDER: metal
        run: dotnet tests/Sharplight.Vulkan.Tests/bin/Release/net11.0/Sharplight.Vulkan.Tests.dll -maxThreads 2 -longRunning 300 -result-xml "$RUNNER_TEMP/metal-attention-tests.xml" ${{ env.METAL_ATTENTION }}

      - name: Metal kernel suite, quantized formats and data kernels
        if: success() || failure()
        timeout-minutes: 45
        env:
          SHARPLIGHT_TEST_PROVIDER: metal
        run: dotnet tests/Sharplight.Vulkan.Tests/bin/Release/net11.0/Sharplight.Vulkan.Tests.dll -maxThreads 2 -longRunning 300 -result-xml "$RUNNER_TEMP/metal-quant-tests.xml" ${{ env.VULKAN_QUANT }} ${{ env.VULKAN_MMQ }}

      - name: Metal kernel suite, remaining classes
        if: success() || failure()
        timeout-minutes: 45
        env:
          SHARPLIGHT_TEST_PROVIDER: metal
        run: dotnet tests/Sharplight.Vulkan.Tests/bin/Release/net11.0/Sharplight.Vulkan.Tests.dll -maxThreads 2 -longRunning 300 -result-xml "$RUNNER_TEMP/metal-other-tests.xml" $(echo "${{ env.VULKAN_CORE }} ${{ env.VULKAN_MMQ }} ${{ env.VULKAN_QUANT }} ${{ env.METAL_ATTENTION }}" | sed 's/-class /-class- /g')

      - name: Failed tests
        if: success() || failure()
        run: |
          for f in "$RUNNER_TEMP"/metal-*.xml; do
            [ -f "$f" ] || continue
            echo "=== $(basename "$f")"
            python3 -c "import sys,xml.etree.ElementTree as E; r=E.parse(sys.argv[1]).getroot(); a=r.find('.//assembly'); print('total', a.get('total'), 'passed', a.get('passed'), 'failed', a.get('failed'), 'skipped', a.get('skipped')); [print('FAIL', t.get('name'), '|', (t.findtext('failure/message') or '')[:400].replace(chr(10),' ')) for t in r.iter('test') if t.get('result')=='Fail']" "$f" | head -80
          done

      - name: Save the kernel cache
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.metal-kernel-cache
          key: macos-metal-kernels-${{ hashFiles('src/Sharplight.Shaders/Kernels/**', 'Directory.Packages.props') }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: macos-metal-test-results
          path: ${{ runner.temp }}/*.xml
          if-no-files-found: ignore

  # Metal against MoltenVK against llama.cpp's Metal backend (built here at a pinned release) on the models of docs/benchmarks.md:
  # prefill of 512 tokens and decode (llama-bench pp512 / tg128). Runs in parallel with the metal job.
  metal-bench:
    name: macOS arm64 LLM benchmark (Metal, MoltenVK, llama.cpp)
    if: ${{ startsWith(github.ref_name, 'macos/metal-') }}
    runs-on: macos-15
    timeout-minutes: 150
    env:
      LLAMA_CPP_TAG: b11177
      SHARPLIGHT_COMPILATION_CACHE: ${{ github.workspace }}/.metal-kernel-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Build
        run: dotnet build samples/Sharplight.Cli -c Release

      - name: Restore the kernel cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.metal-kernel-cache
          key: macos-metal-kernels-${{ hashFiles('src/Sharplight.Shaders/Kernels/**', 'Directory.Packages.props') }}
          restore-keys: macos-metal-kernels-

      - name: Build llama.cpp (Metal)
        continue-on-error: true
        run: |
          git clone --depth 1 --branch "$LLAMA_CPP_TAG" https://github.com/ggml-org/llama.cpp "$RUNNER_TEMP/llama.cpp"
          cmake -S "$RUNNER_TEMP/llama.cpp" -B "$RUNNER_TEMP/llama.cpp/build" -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF -DGGML_METAL=ON
          cmake --build "$RUNNER_TEMP/llama.cpp/build" --target llama-bench -j 3

      - name: Models
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          cd "$RUNNER_TEMP/models"
          curl -fsSL --retry 3 -o qwen3-0.6b-q8_0.gguf https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf
          curl -fsSL --retry 3 -o qwen3-0.6b-q4_k_m.gguf https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q4_K_M.gguf
          curl -fsSL --retry 3 -o qwen3-1.7b-q8_0.gguf https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q8_0.gguf
          curl -fsSL --retry 3 -o qwen3-1.7b-q4_k_m.gguf https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf
          curl -fsSL --retry 3 -o llama-3.2-1b-q4_k_m.gguf https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_K_M.gguf
          curl -fsSL --retry 3 -o llama-3.2-1b-q8_0.gguf https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q8_0.gguf
          ls -l

      - name: Benchmark
        continue-on-error: true
        timeout-minutes: 120
        run: |
          cli=samples/Sharplight.Cli/bin/Release/net11.0/Sharplight.Cli.dll
          bench="$RUNNER_TEMP/llama.cpp/build/bin/llama-bench"
          for model in "$RUNNER_TEMP"/models/*.gguf; do
            name=$(basename "$model" .gguf)
            for provider in metal vulkan; do
              echo "=== $name sharplight $provider"
              dotnet $cli "$model" --provider $provider --bench 512 2>&1 | grep -E 'prefill [0-9]+ tok' || echo "(failed)"
            done
            if [ -x "$bench" ]; then
              echo "=== $name llama.cpp metal"
              "$bench" -m "$model" -ngl 99 -fa 1 -p 512 -n 128 -r 3 -o md 2>&1 | grep -E 'pp512|tg128' || echo "(failed)"
            fi
          done

  macos-arm64:
    name: macOS arm64 (Cpu + Vulkan via MoltenVK)
    runs-on: macos-15
    # macos/metal-* branches iterate on the Metal provider: only the metal job runs there (macOS minutes are limited).
    if: ${{ !startsWith(github.ref_name, 'macos/metal-') }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning needs the history to compute the version height

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Host
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string
          sysctl hw.ncpu hw.memsize
          sysctl hw.optional.arm.FEAT_DotProd hw.optional.arm.FEAT_I8MM hw.optional.arm.FEAT_FP16 hw.optional.arm.FEAT_BF16 hw.optional.arm.FEAT_SME 2>/dev/null || true
          system_profiler SPDisplaysDataType | grep -E 'Chipset|Metal|Cores|Vendor' || true

      - name: Build
        run: |
          dotnet build tests/Sharplight.Cpu.Tests -c Release
          dotnet build tests/Sharplight.Vulkan.Tests -c Release
          dotnet build samples/Sharplight.Cli -c Release

      - name: Bundled MoltenVK
        run: |
          lib=tests/Sharplight.Vulkan.Tests/bin/Release/net11.0/libMoltenVK.dylib
          ls -l "$lib"
          lipo -info "$lib"
          shasum -a 256 "$lib"

      - name: Devices and features (MoltenVK)
        run: dotnet samples/Sharplight.Cli/bin/Release/net11.0/Sharplight.Cli.dll --devices

      - name: vulkaninfo through the bundled MoltenVK
        continue-on-error: true
        run: |
          brew install --quiet vulkan-tools
          lib="$PWD/tests/Sharplight.Vulkan.Tests/bin/Release/net11.0/libMoltenVK.dylib"
          printf '{"file_format_version":"1.0.0","ICD":{"library_path":"%s","api_version":"1.4.0","is_portability_driver":true}}' "$lib" > "$RUNNER_TEMP/MoltenVK_icd.json"
          export VK_DRIVER_FILES="$RUNNER_TEMP/MoltenVK_icd.json"
          vulkaninfo --summary
          vulkaninfo > "$RUNNER_TEMP/vulkaninfo.txt" 2>&1 || true
          grep -A40 'VkPhysicalDevicePortabilitySubsetFeaturesKHR' "$RUNNER_TEMP/vulkaninfo.txt" | head -20 || true
          grep -iE 'shaderIntegerDotProduct|cooperativeMatrix|shaderFloat16|bufferDeviceAddress|subgroupSize|vulkanMemoryModel|shaderInt64' "$RUNNER_TEMP/vulkaninfo.txt" | sort -u || true

      # Compiled kernels (Slang SPIR-V, keyed by content hash) and the device pipeline caches: Slang compilation on the 3-core
      # runner is a large part of the Vulkan suite's time. Stale entries are harmless (they never hit).
      - name: Restore the kernel cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.kernel-cache
          key: macos-kernels-${{ hashFiles('src/Sharplight.Shaders/Kernels/**', 'Directory.Packages.props') }}
          restore-keys: macos-kernels-

      - name: Cpu suite
        if: success() || failure()
        run: dotnet tests/Sharplight.Cpu.Tests/bin/Release/net11.0/Sharplight.Cpu.Tests.dll -maxThreads 2 -result-xml "$RUNNER_TEMP/cpu-tests.xml"

      - name: Smoke model
        if: success() || failure()
        id: model
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/models/smoke.gguf" "$SMOKE_MODEL_URL"
          echo "path=$RUNNER_TEMP/models/smoke.gguf" >> "$GITHUB_OUTPUT"

      - name: LLM smoke test (CPU)
        if: (success() || failure()) && steps.model.outcome == 'success'
        run: |
          dotnet samples/Sharplight.Cli/bin/Release/net11.0/Sharplight.Cli.dll "${{ steps.model.outputs.path }}" --cpu -p "$SMOKE_PROMPT" -n 32 | tee "$RUNNER_TEMP/smoke-cpu.txt"
          grep -q Paris "$RUNNER_TEMP/smoke-cpu.txt"

      - name: LLM smoke test (Vulkan via MoltenVK)
        if: (success() || failure()) && steps.model.outcome == 'success'
        timeout-minutes: 15
        run: |
          dotnet samples/Sharplight.Cli/bin/Release/net11.0/Sharplight.Cli.dll "${{ steps.model.outputs.path }}" -p "$SMOKE_PROMPT" -n 32 | tee "$RUNNER_TEMP/smoke-vulkan.txt"
          grep -q Paris "$RUNNER_TEMP/smoke-vulkan.txt"

      - name: CPU kernel tiers (decode and prefill)
        if: (success() || failure()) && steps.model.outcome == 'success'
        run: |
          for isa in scalar v128 neon neondot; do
            echo "=== SHARPLIGHT_CPU_ISA=$isa"
            SHARPLIGHT_CPU_ISA=$isa dotnet samples/Sharplight.Cli/bin/Release/net11.0/Sharplight.Cli.dll "${{ steps.model.outputs.path }}" --cpu --bench 128 2>&1 | tail -4
          done

      # The paravirtual runner GPU compiles pipelines slowly (MSL translation and Metal compilation, about 0.6 s each) and Slang
      # compiles on 3 cores, so the suite runs in time-boxed parts: the core kernels (elementwise, norms, matmuls, attention),
      # the MMQ GEMMs, the quantized formats and data kernels, then everything else. -longRunning reports tests that run longer
      # than 5 minutes (hangs).
      - name: Vulkan suite, core (MoltenVK)
        if: success() || failure()
        timeout-minutes: 60
        run: dotnet tests/Sharplight.Vulkan.Tests/bin/Release/net11.0/Sharplight.Vulkan.Tests.dll -maxThreads 2 -longRunning 300 -result-xml "$RUNNER_TEMP/vulkan-core-tests.xml" ${{ env.VULKAN_CORE }}

      - name: Vulkan suite, MMQ GEMMs (MoltenVK)
        if: success() || failure()
        timeout-minutes: 45
        run: dotnet tests/Sharplight.Vulkan.Tests/bin/Release/net11.0/Sharplight.Vulkan.Tests.dll -maxThreads 2 -longRunning 300 -result-xml "$RUNNER_TEMP/vulkan-mmq-tests.xml" ${{ env.VULKAN_MMQ }}

      - name: Vulkan suite, quantized formats and data kernels (MoltenVK)
        if: success() || failure()
        timeout-minutes: 60
        run: dotnet tests/Sharplight.Vulkan.Tests/bin/Release/net11.0/Sharplight.Vulkan.Tests.dll -maxThreads 2 -longRunning 300 -result-xml "$RUNNER_TEMP/vulkan-quant-tests.xml" ${{ env.VULKAN_QUANT }}

      - name: Vulkan suite, remaining classes (MoltenVK)
        if: success() || failure()
        timeout-minutes: 60
        run: dotnet tests/Sharplight.Vulkan.Tests/bin/Release/net11.0/Sharplight.Vulkan.Tests.dll -maxThreads 2 -longRunning 300 -result-xml "$RUNNER_TEMP/vulkan-other-tests.xml" $(echo "${{ env.VULKAN_CORE }} ${{ env.VULKAN_MMQ }} ${{ env.VULKAN_QUANT }}" | sed 's/-class /-class- /g')

      - name: Save the kernel cache
        if: success() || failure()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.kernel-cache
          key: macos-kernels-${{ hashFiles('src/Sharplight.Shaders/Kernels/**', 'Directory.Packages.props') }}-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: macos-arm64-test-results
          path: ${{ runner.temp }}/*.xml
          if-no-files-found: ignore

  # The MoltenVK LLM benchmark in its own job (in parallel with the suites, its log is readable as soon as it ends): the
  # defaults, then each perf default of develop switched off, with the per-kernel GPU profile of the prefill for the defaults.
  macos-bench:
    name: macOS arm64 LLM benchmark (MoltenVK)
    runs-on: macos-15
    # macos/metal-* branches iterate on the Metal provider: only the metal job runs there (macOS minutes are limited).
    if: ${{ !startsWith(github.ref_name, 'macos/metal-') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Build
        run: dotnet build samples/Sharplight.Cli -c Release

      - name: Devices and features (MoltenVK)
        run: dotnet samples/Sharplight.Cli/bin/Release/net11.0/Sharplight.Cli.dll --devices

      - name: Restore the kernel cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.kernel-cache
          key: macos-kernels-${{ hashFiles('src/Sharplight.Shaders/Kernels/**', 'Directory.Packages.props') }}
          restore-keys: macos-kernels-

      - name: Smoke model
        id: model
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/models/smoke.gguf" "$SMOKE_MODEL_URL"
          echo "path=$RUNNER_TEMP/models/smoke.gguf" >> "$GITHUB_OUTPUT"

      - name: Vulkan benchmark (MoltenVK), defaults and switches
        continue-on-error: true
        timeout-minutes: 90
        run: |
          cli=samples/Sharplight.Cli/bin/Release/net11.0/Sharplight.Cli.dll
          model="${{ steps.model.outputs.path }}"
          bench() {
            tokens=$1; shift
            echo "=== --bench $tokens $*"
            env "$@" dotnet $cli "$model" --bench $tokens 2>&1 | grep -E 'dispatches|prefill [0-9]+ tok' || echo "(failed)"
          }
          # SHARPLIGHT_GEMM_WIDE=force: the 128 x 128 SIMT tile also where its 32 KB fill the workgroup memory (the selection
          # before round 2); the other switches are develop's perf defaults, which round 2 found neutral here.
          for tokens in 128 512; do
            bench $tokens
            bench $tokens SHARPLIGHT_GEMM_WIDE=force
            bench $tokens SHARPLIGHT_CONCURRENT_WORKGROUPS=0
            bench $tokens SHARPLIGHT_CONCURRENT_WORKGROUPS=0 SHARPLIGHT_GEMM_WIDE=force
          done
          bench 128 SHARPLIGHT_ATTN_FE_CAUSAL=0
          bench 128 SHARPLIGHT_GEMM_WAVE=fixed
          bench 128 SHARPLIGHT_MV_ROWS=1
          bench 128 SHARPLIGHT_DISABLE_FEATURES=kernel_binaries
          # Kernels of the prefill (MoltenVK reports no per-dispatch times: Metal samples timestamps at encoder boundaries).
          echo "=== prefill kernels, defaults"
          SHARPLIGHT_VK_PROFILE=1 dotnet $cli "$model" --bench 128 2>&1 | sed -n '/--- prefill T=/,/--- decode x/p' | grep -E 'matmul|attention' | sed -E 's/.*[0-9]+x  min +[0-9.]+ us  //'

  linux-arm64:
    name: Linux arm64 (Cpu)
    runs-on: ubuntu-24.04-arm
    # macos/metal-* branches iterate on the Metal provider: only the metal job runs there (macOS minutes are limited).
    if: ${{ !startsWith(github.ref_name, 'macos/metal-') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Host
        run: |
          uname -m
          lscpu | grep -E 'Model name|^CPU\(s\)|Vendor'
          grep -m1 -o -E '\b(asimddp|i8mm|asimdhp|bf16|sve|sve2)\b' /proc/cpuinfo | sort -u | tr '\n' ' ' || true
          echo; grep -m1 Features /proc/cpuinfo
          free -g

      - name: Build
        run: |
          dotnet build tests/Sharplight.Cpu.Tests -c Release
          dotnet build samples/Sharplight.Cli -c Release

      - name: Devices
        run: dotnet samples/Sharplight.Cli/bin/Release/net11.0/Sharplight.Cli.dll --devices

      - name: Cpu suite
        run: dotnet tests/Sharplight.Cpu.Tests/bin/Release/net11.0/Sharplight.Cpu.Tests.dll -maxThreads 4 -result-xml "$RUNNER_TEMP/cpu-tests.xml"

      - name: Cpu suite, NEON tier without dot products (kernel tests)
        if: success() || failure()
        env:
          SHARPLIGHT_CPU_ISA: neon
        run: >
          dotnet tests/Sharplight.Cpu.Tests/bin/Release/net11.0/Sharplight.Cpu.Tests.dll -maxThreads 4
          -class Sharplight.Cpu.Tests.IntDotTests -class Sharplight.Cpu.Tests.QuantTests -class Sharplight.Cpu.Tests.BatchMatMulTests
          -class Sharplight.Cpu.Tests.ConvTests -class Sharplight.Cpu.Tests.EndToEndTests -class Sharplight.Cpu.Tests.MatMulEpilogueTests

      - name: Smoke model
        if: success() || failure()
        id: model
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/models/smoke.gguf" "$SMOKE_MODEL_URL"
          echo "path=$RUNNER_TEMP/models/smoke.gguf" >> "$GITHUB_OUTPUT"

      - name: LLM smoke test (CPU)
        if: (success() || failure()) && steps.model.outcome == 'success'
        run: |
          dotnet samples/Sharplight.Cli/bin/Release/net11.0/Sharplight.Cli.dll "${{ steps.model.outputs.path }}" --cpu -p "$SMOKE_PROMPT" -n 32 | tee "$RUNNER_TEMP/smoke-cpu.txt"
          grep -q Paris "$RUNNER_TEMP/smoke-cpu.txt"

      - name: CPU kernel tiers (decode and prefill)
        if: (success() || failure()) && steps.model.outcome == 'success'
        run: |
          for isa in scalar v128 neon neondot; do
            echo "=== SHARPLIGHT_CPU_ISA=$isa"
            SHARPLIGHT_CPU_ISA=$isa dotnet samples/Sharplight.Cli/bin/Release/net11.0/Sharplight.Cli.dll "${{ steps.model.outputs.path }}" --cpu --bench 128 2>&1 | tail -4
          done

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: linux-arm64-test-results
          path: ${{ runner.temp }}/*.xml
          if-no-files-found: ignore

  studio-app:
    name: Sharplight Studio.app (osx-arm64)
    runs-on: macos-15
    # macos/metal-* branches iterate on the Metal provider: only the metal job runs there (macOS minutes are limited).
    if: ${{ !startsWith(github.ref_name, 'macos/metal-') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Version
        id: nbgv
        uses: dotnet/nbgv@v0.4
        with:
          setAllVars: true

      - name: Build the app bundle
        run: packaging/macos/build-app.sh "${{ steps.nbgv.outputs.NuGetPackageVersion }}" artifacts/studio

      - name: Check the bundle
        run: |
          app="artifacts/studio/Sharplight Studio.app"
          plutil -lint "$app/Contents/Info.plist"
          ls -l "$app/Contents/MacOS/sharplight-studio" "$app/Contents/Frameworks/libMoltenVK.dylib" "$app/Contents/Resources/sharplight-studio.icns"
          "$app/Contents/MacOS/sharplight-studio" --version

      # The release track's Velopack package (studio.yml, packaging/pack-studio.sh) with MoltenVK inside.
      - name: Velopack package (pack-studio.sh)
        run: |
          vpk_version=$(sed -n "s/^  VPK_VERSION: '\(.*\)'.*/\1/p" .github/workflows/studio.yml)
          dotnet tool install --global vpk --version "$vpk_version"
          packaging/pack-studio.sh osx-arm64 osx-arm64-unstable "${{ steps.nbgv.outputs.NuGetPackageVersion }}" artifacts/velopack
          zip=$(ls artifacts/velopack/*Portable*.zip | head -1)
          unzip -l "$zip" | grep -E 'libMoltenVK.dylib|LICENSE-MoltenVK.txt|MacOS/sharplight-studio$'

      - uses: actions/upload-artifact@v4
        with:
          name: sharplight-studio-${{ steps.nbgv.outputs.NuGetPackageVersion }}-macos-arm64
          path: artifacts/studio/*.zip
          if-no-files-found: error
