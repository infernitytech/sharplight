name: Native libraries

# Builds Sharplight's native libraries. Audio:
# the audio library (native/sharplight_audio: miniaudio, libopus, libogg, opusfile and stb_vorbis from third_party/)
# for win-x64, win-arm64, linux-x64, linux-arm64 and osx-arm64 and uploads the binaries as the artifacts `native-audio-*`. The binaries are
# never committed: ci.yml, packages.yml and studio.yml call this workflow and download the artifacts into native/sharplight_audio/out/
# before building, testing or packing (src/Sharplight.Audio packs them as runtimes/<rid>/native/).
#
#   linux-x64, linux-arm64, win-x64, win-arm64   cross-compiled with zig cc on ubuntu (exports, glibc baseline 2.28 and dependencies verified)
#   osx-arm64                                    built with the system clang on macOS (the Apple SDK provides the CoreAudio headers)
#   native tests                                 C tests with ASan + UBSan (round-trips, null-backend devices, decoder fuzzing) on linux-x64
#   smoke                                        the managed audio tests on the other native runners (decode fixtures, null-backend devices)
#
# Video: Sharplight's own LGPL FFmpeg (native/ffmpeg/build.sh: FFmpeg + libvpx, dav1d, SVT-AV1, OpenH264, libopus, zlib; sources pinned
# in third_party/sources.json) as shared libraries, artifacts `native-ffmpeg-<rid>` unpacked into native/ffmpeg/out/ by the consumers.
#
#   linux-x64, linux-arm64       zig cc on ubuntu (glibc 2.28 baseline)
#   win-x64, win-arm64           llvm-mingw on ubuntu
#   osx-arm64                    the system clang on macOS (VideoToolbox / AudioToolbox)
#   verify                       file types, LGPL configuration, dependencies (system libraries only), glibc baseline
#   smoke                        the managed Sharplight.Video tests (encode every codec, decode, audio tracks) on every platform
#
# Triggered by the workflows that need the binaries; run it by hand to check a change to native/ or third_party/ in isolation.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross:
    name: linux + windows (zig)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install zig
        run: echo "ZIG=$(native/sharplight_audio/install-zig.sh "$RUNNER_TEMP/zig" | tail -1)" >> "$GITHUB_ENV"

      - name: Build
        env:
          SLA_OUT: ${{ github.workspace }}/native-out
          SLA_BUILD: ${{ runner.temp }}/sla-obj
        run: native/sharplight_audio/build.sh all --jobs "$(nproc)"

      - name: Verify
        run: native/sharplight_audio/verify.sh native-out

      - uses: actions/upload-artifact@v4
        with:
          name: native-audio-zig
          path: native-out/*/
          if-no-files-found: error

  ffmpeg-cross:
    name: "ffmpeg: ${{ matrix.rid }}"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64, win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4

      # meson itself is installed by build.sh into a venv at the pinned version (with its hash).
      - name: Install build tools
        run: sudo apt-get install -y --no-install-recommends ninja-build pkgconf python3-venv

      - name: Install zig
        if: startsWith(matrix.rid, 'linux-')
        run: echo "ZIG=$(native/sharplight_audio/install-zig.sh "$RUNNER_TEMP/zig" | tail -1)" >> "$GITHUB_ENV"

      # The pinned archives (FFmpeg, codec libraries, nasm, llvm-mingw); the hashes in sources.json are checked after every restore.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/slf-cache/downloads
          key: ffmpeg-sources-${{ hashFiles('third_party/sources.json') }}

      - name: Build
        env:
          SLF_CACHE: ${{ runner.temp }}/slf-cache
          SLF_BUILD: ${{ runner.temp }}/slf-build
          SLF_OUT: ${{ github.workspace }}/native-ffmpeg-out
        run: native/ffmpeg/build.sh "${{ matrix.rid }}" --jobs "$(nproc)"

      - name: Verify
        run: native/ffmpeg/verify.sh native-ffmpeg-out "${{ matrix.rid }}"

      - uses: actions/upload-artifact@v4
        with:
          name: native-ffmpeg-${{ matrix.rid }}
          path: native-ffmpeg-out/*/
          if-no-files-found: error

  ffmpeg-macos:
    name: "ffmpeg: osx-arm64"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install --quiet ninja pkgconf

      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/slf-cache/downloads
          key: ffmpeg-sources-${{ hashFiles('third_party/sources.json') }}

      - name: Build
        env:
          SLF_CACHE: ${{ runner.temp }}/slf-cache
          SLF_BUILD: ${{ runner.temp }}/slf-build
          SLF_OUT: ${{ github.workspace }}/native-ffmpeg-out
        run: native/ffmpeg/build.sh osx-arm64 --jobs "$(sysctl -n hw.ncpu)"

      - name: Verify
        run: native/ffmpeg/verify.sh native-ffmpeg-out osx-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: native-ffmpeg-osx-arm64
          path: native-ffmpeg-out/*/
          if-no-files-found: error

  native-tests:
    name: native tests (linux-x64, ASan + UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install zig
        run: echo "ZIG=$(native/sharplight_audio/install-zig.sh "$RUNNER_TEMP/zig" | tail -1)" >> "$GITHUB_ENV"

      - name: Build the sanitizer variant
        env:
          SLA_OUT: ${{ runner.temp }}/sla-asan
          SLA_BUILD: ${{ runner.temp }}/sla-asan-obj
        run: native/sharplight_audio/build.sh host-sanitize --jobs "$(nproc)"

      - name: Run
        env:
          SLA_OUT: ${{ runner.temp }}/sla-asan
        run: native/sharplight_audio/tests/run.sh "$SLA_OUT/linux-x64-asan" tests/Sharplight.Audio.Tests/Fixtures 500

  macos:
    name: osx-arm64 (clang)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          SLA_OUT: ${{ github.workspace }}/native-out
          SLA_BUILD: ${{ runner.temp }}/sla-obj
        run: native/sharplight_audio/build.sh osx-arm64 --jobs "$(sysctl -n hw.ncpu)"

      - name: Verify
        run: native/sharplight_audio/verify.sh native-out osx-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: native-audio-osx
          path: native-out/*/
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.rid }})
    needs: [cross, macos, ffmpeg-cross, ffmpeg-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-24.04 }
          - { rid: win-x64, os: windows-latest }
          - { rid: win-arm64, os: windows-11-arm }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64, os: macos-15 }
    runs-on: ${{ matrix.os }}
    # A hung test once kept this job running for hours and, through the Studio workflow's per-branch concurrency, blocked every later
    # Studio build; time limits make such a hang a failed job instead.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning needs the history to compute the version

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - uses: actions/download-artifact@v4
        with:
          pattern: native-audio-*
          merge-multiple: true
          path: native/sharplight_audio/out

      - uses: actions/download-artifact@v4
        with:
          pattern: native-ffmpeg-*
          merge-multiple: true
          path: native/ffmpeg/out

      # Decodes every fixture format against the analytic signal and runs the null-backend device tests on the real platform; ffmpeg is
      # not installed there, so the ffmpeg comparison skips itself.
      - name: Audio tests
        timeout-minutes: 15
        shell: bash
        run: dotnet run --project tests/Sharplight.Audio.Tests -c Release

      # Encodes a clip with every software codec of the platform's FFmpeg build, decodes it again, writes and reads audio tracks, and
      # tries the hardware encoders the runner has; fails when the libraries are missing from the build output.
      - name: Video tests
        timeout-minutes: 15
        shell: bash
        run: dotnet run --project tests/Sharplight.Video.Tests -c Release
