# Model feed (docs/model-feed.md): builds preconverted, signed .slm packages from verified-catalog entries and publishes them to the
# Cloudflare R2 bucket under models/ (https://download.sharplight.dev/models/).
#
# - Channels: package versions are stored once (models/packages/<id>/<version>/, shared); models/unstable/ and models/stable/ each
#   have their own signed index. New builds go to unstable; `promote` lists already published versions in stable (no re-upload).
#   Every run re-signs both channels' indexes.
# - Push to develop that changes tools/model-feed/publish-request.json: builds the entries listed there into unstable and promotes
#   the listed versions (no entries and no promotions: only re-signs). This is the trigger until the workflow is on the default branch (dispatch and schedule only
#   run from there) and the one the studio-release environment admits (develop, release/*).
# - Manual dispatch: builds the given catalog entries and publishes them (or only re-signs the index when no entries are given).
# - Weekly schedule: only re-signs the index (new sequence, expiry 30 days ahead), so the published index never expires while
#   nobody publishes; it builds nothing and does nothing before the first publication.
#
# - Signing key: the secret MODEL_FEED_SIGNING_KEY of the `studio-release` environment: an ECDSA P-384 private key in PEM
#   (a `feedtool keygen` JSON key file works too). Without it the workflow builds nothing and says so.
# - Trust: keys/keyset.json in the bucket lists the feed keys, signed by a root key. When the bucket has none, the signing key is
#   its own root (single-key setup); hosts trust tools/model-feed/keys/sharplight-feed.pub.pem (docs/model-feed.md, "Publishing keys").
# - Published versions are immutable: existing package objects are never overwritten or deleted; only the listings (package indexes,
#   catalog pages, index.json and its signature) are rewritten, after the package objects.
# - Runners (docs/model-feed.md, "Self-hosted feed runner"): the `plan` job splits the requested entries by size from the catalog.
#   Small ones build and publish on ubuntu-latest (about 14 GB free disk); large ones (sources above MODEL_FEED_LARGE_BYTES, default
#   6 GB, or listed in MODEL_FEED_LARGE_ENTRIES) afterwards on the self-hosted runner labelled `sharplight-feed`, only for a push or a
#   dispatch on develop, and only when the repository variable MODEL_FEED_SELF_HOSTED is 'true' (and, when the secret
#   MODEL_FEED_RUNNER_TOKEN is set, a runner with that label is online). Otherwise large entries are skipped with a warning and the small
#   ones still publish. Both passes run model-feed-publish.yml in the studio-release environment, one after the other.
name: model-feed

on:
  push:
    branches: [develop]
    paths: [tools/model-feed/publish-request.json]
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC: re-sign only, well before the 30-day expiry
  workflow_dispatch:
    inputs:
      entries:
        description: 'Catalog entries to build into unstable, space separated: entry or entry:variant (default variant: the recommended one).'
        required: false
        default: ''
      promote:
        description: 'Package versions to promote from unstable to stable, space separated: id@version, or id for its latest unstable version.'
        required: false
        default: ''
      validity_days:
        description: 'Days until the published index expires (republish before; hosts reject an expired index).'
        required: false
        default: '30'

# One publication at a time, never cancelled halfway (listings must stay consistent with the package objects).
concurrency:
  group: model-feed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      small: ${{ steps.split.outputs.small }}
      large: ${{ steps.split.outputs.large }}
      promote_small: ${{ steps.split.outputs.promote_small }}
      promote_large: ${{ steps.split.outputs.promote_large }}
      validity: ${{ steps.request.outputs.validity }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the publish request
        id: request
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENTRIES: ${{ inputs.entries }}
          INPUT_PROMOTE: ${{ inputs.promote }}
          INPUT_VALIDITY: ${{ inputs.validity_days }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push)
              request=tools/model-feed/publish-request.json
              entries=$(jq -r '(.entries // []) | join(" ")' "$request")
              promote=$(jq -r '(.promote // []) | join(" ")' "$request")
              channel=$(jq -r '.channel // "stable"' "$request")
              validity=$(jq -r '.validityDays // 30' "$request")
              echo "Publish request: $(jq -r '.reason // "(no reason given)"' "$request")"
              ;;
            workflow_dispatch)
              entries="$INPUT_ENTRIES"
              promote="$INPUT_PROMOTE"
              channel=stable
              validity="${INPUT_VALIDITY:-30}"
              ;;
            *)
              # Scheduled: re-sign only.
              entries=""
              promote=""
              channel=stable
              validity=30
              ;;
          esac
          for spec in $entries; do
            if ! [[ "$spec" =~ ^[a-z0-9][a-z0-9.-]*(:[a-z0-9][a-z0-9.-]*)?$ ]]; then
              echo "::error::'$spec' is not an entry or entry:variant id."
              exit 1
            fi
          done
          for spec in $promote; do
            if ! [[ "$spec" =~ ^[a-z0-9][a-z0-9.-]*(@[0-9A-Za-z.+-]+)?$ ]]; then
              echo "::error::'$spec' is not a package id or id@version."
              exit 1
            fi
          done
          if [ "$channel" != "stable" ] && [ -n "$promote" ]; then
            echo "::error::Promotions go to the stable channel (channel was '$channel'); new builds always go to unstable."
            exit 1
          fi
          if ! [[ "$validity" =~ ^[0-9]+$ ]] || [ "$validity" -lt 1 ] || [ "$validity" -gt 90 ]; then
            echo "::error::validityDays must be a whole number of days from 1 to 90 (was '$validity')."
            exit 1
          fi
          echo "entries=$entries" >> "$GITHUB_OUTPUT"
          echo "promote=$promote" >> "$GITHUB_OUTPUT"
          echo "validity=$validity" >> "$GITHUB_OUTPUT"
          echo "Build into unstable: ${entries:-(none)}; promote to stable: ${promote:-(none)}; indexes valid for $validity days"

      - name: Check the self-hosted feed runner
        id: runner
        env:
          ENABLED: ${{ vars.MODEL_FEED_SELF_HOSTED }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          # Optional: a token that may list runners (fine-grained, "Administration: read" on the repository or "Self-hosted runners:
          # read" on the organization). Without it an enabled runner is assumed online.
          GH_TOKEN: ${{ secrets.MODEL_FEED_RUNNER_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          available=false
          if [ "$ENABLED" != "true" ]; then
            echo "The self-hosted feed runner is not enabled (repository variable MODEL_FEED_SELF_HOSTED)."
          elif [ "$EVENT" != "push" ] && [ "$EVENT" != "workflow_dispatch" ] || [ "$REF" != "refs/heads/develop" ]; then
            echo "The self-hosted feed runner only takes pushes and dispatches on develop (this is $EVENT on $REF)."
          elif [ -z "$GH_TOKEN" ]; then
            echo "::notice::MODEL_FEED_RUNNER_TOKEN is not set: assuming the self-hosted feed runner is online. If it is not, the large pass waits in the queue (GitHub cancels it after 24 hours); the small pass is published first either way."
            available=true
          else
            online=$( { gh api "repos/$REPOSITORY/actions/runners" --paginate --jq '.runners[]' 2>/dev/null; \
                        gh api "orgs/$OWNER/actions/runners" --paginate --jq '.runners[]' 2>/dev/null; } \
                      | jq -s '[.[] | select(.status == "online" and ([.labels[].name] | index("sharplight-feed")))] | length')
            if [ "${online:-0}" -gt 0 ]; then
              echo "$online self-hosted feed runner(s) online."
              available=true
            else
              echo "No runner labelled sharplight-feed is online (or the token cannot list runners)."
            fi
          fi
          echo "available=$available" >> "$GITHUB_OUTPUT"

      - name: Split by size
        id: split
        env:
          ENTRIES: ${{ steps.request.outputs.entries }}
          PROMOTE: ${{ steps.request.outputs.promote }}
          THRESHOLD: ${{ vars.MODEL_FEED_LARGE_BYTES || '6000000000' }}
          LARGE: ${{ vars.MODEL_FEED_LARGE_ENTRIES }}
          AVAILABLE: ${{ steps.runner.outputs.available }}
        run: |
          set -euo pipefail
          python3 -I tools/model-feed/split-request.py --catalog catalog/verified-models.json --entries "$ENTRIES" --promote "$PROMOTE" \
            --threshold-bytes "$THRESHOLD" --large "$LARGE" --self-hosted "$AVAILABLE" >> "$GITHUB_OUTPUT"

  # Small entries, promotions of packages that are not built by the large pass, and the re-sign of both channels.
  small:
    needs: plan
    uses: ./.github/workflows/model-feed-publish.yml
    secrets: inherit
    with:
      runs-on: '"ubuntu-latest"'
      entries: ${{ needs.plan.outputs.small }}
      promote: ${{ needs.plan.outputs.promote_small }}
      validity: ${{ needs.plan.outputs.validity }}
      timeout-minutes: 180

  # Large entries on the self-hosted feed runner, after the small pass (one publication at a time). Never for pull requests: the
  # workflow has no pull_request trigger, and the job also checks the event and the branch.
  large:
    needs: [plan, small]
    if: >-
      !cancelled() && needs.small.result == 'success' && needs.plan.outputs.large != '' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
    uses: ./.github/workflows/model-feed-publish.yml
    secrets: inherit
    with:
      runs-on: '["self-hosted","sharplight-feed"]'
      entries: ${{ needs.plan.outputs.large }}
      promote: ${{ needs.plan.outputs.promote_large }}
      validity: ${{ needs.plan.outputs.validity }}
      work-dir: ${{ vars.MODEL_FEED_WORK_DIR || '' }}
      timeout-minutes: 1440
