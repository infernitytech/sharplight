name: Packages

# Builds the solution and packs the libraries under src/ as NuGet packages (versions from version.json via
# Nerdbank.GitVersioning). Pushes to main and pull requests upload the packages as a build artifact; a tag v<major>.<minor>.<patch>
# (create it with `nbgv tag`) or a manual run also publishes them to nuget.org.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packages to nuget.org
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.nbgv.outputs.NuGetPackageVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning needs the history to compute the version height

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Version
        id: nbgv
        uses: dotnet/nbgv@v0.4
        with:
          setAllVars: true

      - name: Restore
        run: dotnet restore Sharplight.slnx

      - name: Build
        run: dotnet build Sharplight.slnx -c Release --no-restore

      - name: Pack
        run: dotnet pack Sharplight.slnx -c Release --no-build -o artifacts/packages

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.nbgv.outputs.NuGetPackageVersion }}
          path: artifacts/packages
          if-no-files-found: error

  publish:
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write # nuget.org trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages-${{ needs.pack.outputs.version }}
          path: packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: nuget.org login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
