# Model feed (docs/model-feed.md): builds preconverted, signed .slm packages from verified-catalog entries and publishes them to the
# Cloudflare R2 bucket under models/ (https://download.sharplight.dev/models/).
#
# - Channels: package versions are stored once (models/packages/<id>/<version>/, shared); models/unstable/ and models/stable/ each
#   have their own signed index. New builds go to unstable; `promote` lists already published versions in stable (no re-upload).
#   Every run re-signs both channels' indexes.
# - Push to develop that changes tools/model-feed/publish-request.json: builds the entries listed there into unstable and promotes
#   the listed versions (no entries and no promotions: only re-signs). This is the trigger until the workflow is on the default branch (dispatch and schedule only
#   run from there) and the one the studio-release environment admits (develop, release/*).
# - Manual dispatch: builds the given catalog entries and publishes them (or only re-signs the index when no entries are given).
# - Weekly schedule: only re-signs the index (new sequence, expiry 30 days ahead), so the published index never expires while
#   nobody publishes; it builds nothing and does nothing before the first publication.
#
# - Signing key: the secret MODEL_FEED_SIGNING_KEY of the `studio-release` environment: an ECDSA P-384 private key in PEM
#   (a `feedtool keygen` JSON key file works too). Without it the workflow builds nothing and says so.
# - Trust: keys/keyset.json in the bucket lists the feed keys, signed by a root key. When the bucket has none, the signing key is
#   its own root (single-key setup); hosts trust tools/model-feed/keys/sharplight-feed.pub.pem (docs/model-feed.md, "Publishing keys").
# - Published versions are immutable: existing package objects are never overwritten or deleted; only the listings (package indexes,
#   catalog pages, index.json and its signature) are rewritten, after the package objects.
name: model-feed

on:
  push:
    branches: [develop]
    paths: [tools/model-feed/publish-request.json]
  schedule:
    - cron: '17 4 * * 1' # Mondays 04:17 UTC: re-sign only, well before the 30-day expiry
  workflow_dispatch:
    inputs:
      entries:
        description: 'Catalog entries to build into unstable, space separated: entry or entry:variant (default variant: the recommended one).'
        required: false
        default: ''
      promote:
        description: 'Package versions to promote from unstable to stable, space separated: id@version, or id for its latest unstable version.'
        required: false
        default: ''
      validity_days:
        description: 'Days until the published index expires (republish before; hosts reject an expired index).'
        required: false
        default: '30'

# One publication at a time, never cancelled halfway (listings must stay consistent with the package objects).
concurrency:
  group: model-feed
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: studio-release
    env:
      FEED_PREFIX: ${{ vars.MODEL_FEED_PREFIX || 'models' }}
      FEED_URL: ${{ vars.MODEL_FEED_URL || 'https://download.sharplight.dev/models' }}
      FEED_NAME: Sharplight verified models
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      WORK: ${{ github.workspace }}/../feed-work
    steps:
      - name: Check secrets
        id: secrets
        env:
          SIGNING_KEY: ${{ secrets.MODEL_FEED_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::The secret MODEL_FEED_SIGNING_KEY is not set in the studio-release environment; nothing is built or published (docs/model-feed.md, 'Publishing keys')."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$R2_BUCKET" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::warning::R2 secrets of the studio-release environment are incomplete; nothing is built or published."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.skip == 'false'
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning needs the history to compute the engine version

      - name: Read the publish request
        id: request
        if: steps.secrets.outputs.skip == 'false'
        env:
          EVENT: ${{ github.event_name }}
          INPUT_ENTRIES: ${{ inputs.entries }}
          INPUT_PROMOTE: ${{ inputs.promote }}
          INPUT_VALIDITY: ${{ inputs.validity_days }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push)
              request=tools/model-feed/publish-request.json
              entries=$(jq -r '(.entries // []) | join(" ")' "$request")
              promote=$(jq -r '(.promote // []) | join(" ")' "$request")
              channel=$(jq -r '.channel // "stable"' "$request")
              validity=$(jq -r '.validityDays // 30' "$request")
              echo "Publish request: $(jq -r '.reason // "(no reason given)"' "$request")"
              ;;
            workflow_dispatch)
              entries="$INPUT_ENTRIES"
              promote="$INPUT_PROMOTE"
              channel=stable
              validity="${INPUT_VALIDITY:-30}"
              ;;
            *)
              # Scheduled: re-sign only.
              entries=""
              promote=""
              channel=stable
              validity=30
              ;;
          esac
          for spec in $entries; do
            if ! [[ "$spec" =~ ^[a-z0-9][a-z0-9.-]*(:[a-z0-9][a-z0-9.-]*)?$ ]]; then
              echo "::error::'$spec' is not an entry or entry:variant id."
              exit 1
            fi
          done
          for spec in $promote; do
            if ! [[ "$spec" =~ ^[a-z0-9][a-z0-9.-]*(@[0-9A-Za-z.+-]+)?$ ]]; then
              echo "::error::'$spec' is not a package id or id@version."
              exit 1
            fi
          done
          if [ "$channel" != "stable" ] && [ -n "$promote" ]; then
            echo "::error::Promotions go to the stable channel (channel was '$channel'); new builds always go to unstable."
            exit 1
          fi
          if ! [[ "$validity" =~ ^[0-9]+$ ]] || [ "$validity" -lt 1 ] || [ "$validity" -gt 90 ]; then
            echo "::error::validityDays must be a whole number of days from 1 to 90 (was '$validity')."
            exit 1
          fi
          echo "entries=$entries" >> "$GITHUB_OUTPUT"
          echo "promote=$promote" >> "$GITHUB_OUTPUT"
          echo "validity=$validity" >> "$GITHUB_OUTPUT"
          echo "Build into unstable: ${entries:-(none)}; promote to stable: ${promote:-(none)}; indexes valid for $validity days"

      - uses: actions/setup-dotnet@v4
        if: steps.secrets.outputs.skip == 'false'
        with:
          dotnet-version: '11.0.x'

      - name: Build the feed tool
        if: steps.secrets.outputs.skip == 'false'
        run: dotnet build tools/model-feed/Sharplight.FeedTool -c Release

      - name: Write the signing key
        if: steps.secrets.outputs.skip == 'false'
        env:
          SIGNING_KEY: ${{ secrets.MODEL_FEED_SIGNING_KEY }}
          ROOT_PUBLIC_KEY: ${{ vars.MODEL_FEED_ROOT_PUBLIC_KEY }}
        run: |
          mkdir -p "$WORK"
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/feed.key.pem"
          # The root the published key set must verify against: the committed official key unless a variable overrides it.
          if [ -n "$ROOT_PUBLIC_KEY" ]; then
            printf '%s\n' "$ROOT_PUBLIC_KEY" > "$RUNNER_TEMP/root.pub.pem"
          else
            cp tools/model-feed/keys/sharplight-feed.pub.pem "$RUNNER_TEMP/root.pub.pem"
          fi

      - name: Fetch the published listings
        if: steps.secrets.outputs.skip == 'false'
        env:
          RESIGN_ONLY: ${{ steps.request.outputs.entries == '' && steps.request.outputs.promote == '' }}
        run: |
          if [ "$RESIGN_ONLY" = "true" ] && ! aws s3api head-object --bucket "$R2_BUCKET" --key "$FEED_PREFIX/unstable/index.json" --endpoint-url "$R2_ENDPOINT" > /dev/null 2>&1; then
            echo "::notice::No feed is published yet; a re-sign without entries or promotions has nothing to do."
            echo "NOTHING_PUBLISHED=true" >> "$GITHUB_ENV"
            exit 0
          fi
          # Metadata only (no package files): versions are chosen against it and the new listings are written from it.
          aws s3 sync "s3://$R2_BUCKET/$FEED_PREFIX/" "$WORK/feed/" --endpoint-url "$R2_ENDPOINT" --exclude "*.slm" --only-show-errors
          if [ ! -f "$WORK/feed/keys/keyset.json" ]; then
            echo "::notice::The bucket has no key set; writing one with the signing key as its own root (single-key setup)."
            dotnet tools/model-feed/Sharplight.FeedTool/bin/Release/net11.0/feedtool.dll keyset --feed "$WORK/feed" \
              --root-key "$RUNNER_TEMP/feed.key.pem" --feed-key "$RUNNER_TEMP/feed.key.pem"
            echo "NEW_KEYSET=true" >> "$GITHUB_ENV"
          fi

      - name: Build packages
        if: steps.secrets.outputs.skip == 'false' && env.NOTHING_PUBLISHED != 'true'
        env:
          ENTRIES: ${{ steps.request.outputs.entries }}
        run: |
          mkdir -p "$WORK/staging"
          for spec in $ENTRIES; do
            entry="${spec%%:*}"
            args=(--entry "$entry")
            if [ "$spec" != "$entry" ]; then
              args+=(--variant "${spec#*:}")
            fi
            dotnet tools/model-feed/Sharplight.FeedTool/bin/Release/net11.0/feedtool.dll build "${args[@]}" \
              --out "$WORK/staging" --store "$WORK/store" --feed "$WORK/feed" --feed-url "$FEED_URL"
            # Downloads and conversion inputs are not needed after the build; keep the runner's disk free.
            rm -rf "$WORK/store"
          done
          ls -1 "$WORK/staging" | tee "$WORK/staged.txt"

      - name: Publish locally and verify
        if: steps.secrets.outputs.skip == 'false' && env.NOTHING_PUBLISHED != 'true'
        env:
          VALIDITY: ${{ steps.request.outputs.validity }}
          PROMOTE: ${{ steps.request.outputs.promote }}
        run: |
          set -euo pipefail
          tool=tools/model-feed/Sharplight.FeedTool/bin/Release/net11.0/feedtool.dll
          common=(--feed "$WORK/feed" --key "$RUNNER_TEMP/feed.key.pem" --name "$FEED_NAME" --validity-days "$VALIDITY")
          staged=$(find "$WORK/staging" -mindepth 1 -maxdepth 1 -type d | sort)
          if [ -n "$staged" ]; then
            dotnet "$tool" publish $staged --channel unstable "${common[@]}"
          else
            dotnet "$tool" reindex --channel unstable "${common[@]}"
          fi
          if [ -n "$PROMOTE" ]; then
            dotnet "$tool" promote $PROMOTE --to stable --from unstable "${common[@]}"
          else
            dotnet "$tool" reindex --channel stable "${common[@]}"
          fi
          # Listings, signatures and digests of both channels as a host checks them (earlier package files are not downloaded here).
          for channel in unstable stable; do
            dotnet "$tool" verify --feed "$WORK/feed" --channel "$channel" --root "$RUNNER_TEMP/root.pub.pem"
          done

      - name: Upload to Cloudflare R2
        if: steps.secrets.outputs.skip == 'false' && env.NOTHING_PUBLISHED != 'true'
        run: |
          set -euo pipefail
          s3() { aws s3 "$@" --endpoint-url "$R2_ENDPOINT" --only-show-errors; }
          type_of() {
            case "$1" in
              *.json) echo application/json ;;
              *.sig) echo application/jose ;;
              *) echo application/octet-stream ;;
            esac
          }
          upload() { # file, key, cache-control
            s3 cp "$WORK/feed/$1" "s3://$R2_BUCKET/$FEED_PREFIX/$1" --content-type "$(type_of "$1")" --cache-control "$2"
          }
          # 1. New package versions (immutable): never overwrite an object that exists.
          for folder in $(cat "$WORK/staged.txt"); do
            id=$(jq -r .id "$WORK/staging/$folder/manifest.json")
            version=$(jq -r .version "$WORK/staging/$folder/manifest.json")
            version_dir="packages/$id/$version"
            # A manifest-only version (same package file, changed metadata) has no package file locally: copy the earlier version's
            # object server-side first (the package object always precedes the manifest).
            if [ -f "$WORK/staging/$folder/reuse.json" ]; then
              from_version=$(jq -r .version "$WORK/staging/$folder/reuse.json")
              from_file=$(jq -r .file "$WORK/staging/$folder/reuse.json")
              to_file=$(jq -r '.files[0].name' "$WORK/staging/$folder/manifest.json")
              if ! aws s3api head-object --bucket "$R2_BUCKET" --key "$FEED_PREFIX/$version_dir/$to_file" --endpoint-url "$R2_ENDPOINT" > /dev/null 2>&1; then
                s3 cp "s3://$R2_BUCKET/$FEED_PREFIX/packages/$id/$from_version/$from_file" "s3://$R2_BUCKET/$FEED_PREFIX/$version_dir/$to_file" \
                  --metadata-directive REPLACE --content-type application/octet-stream --cache-control "public, max-age=31536000, immutable"
              fi
            fi
            for file in "$WORK/feed/$version_dir"/*; do
              key="$version_dir/$(basename "$file")"
              if aws s3api head-object --bucket "$R2_BUCKET" --key "$FEED_PREFIX/$key" --endpoint-url "$R2_ENDPOINT" > /dev/null 2>&1; then
                echo "::warning::$key exists already; published objects are never replaced."
                continue
              fi
              upload "$key" "public, max-age=31536000, immutable"
            done
          done
          # 2. Key set (only when written by this run); then per channel its package indexes, catalog pages, and the index and its
          #    signature last.
          if [ "${NEW_KEYSET:-false}" = "true" ]; then
            upload keys/keyset.json "no-cache"
            upload keys/keyset.sig "no-cache"
          fi
          for channel in unstable stable; do
            for file in $(cd "$WORK/feed" && ls "$channel"/packages/*/index.json "$channel"/catalog/page/*.json 2>/dev/null); do
              upload "$file" "no-cache"
            done
            upload "$channel/catalog/index.json" "no-cache"
            upload "$channel/index.json" "no-cache"
            upload "$channel/index.sig" "no-cache"
            echo "Published: $FEED_URL/$channel/index.json"
          done

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/feed.key.pem" "$RUNNER_TEMP/root.pub.pem"
