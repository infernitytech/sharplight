name: Packages

# Builds the solution and packs the libraries under src/ as NuGet packages (versions from version.json via
# Nerdbank.GitVersioning). Every run uploads the packages as a build artifact.
# A push to a release/* branch (cut with `nbgv prepare-release`, see docs/releasing.md) also publishes them to nuget.org
# (trusted publishing). Nothing is ever published to nuget.org from main or a pull request, not even by a manual run.
# A push to main publishes the prerelease packages (0.x.y-alpha.g<commit>) to the GitHub Packages NuGet feed of the
# repository owner once CI is green for the same commit (job `prerelease`); never from forks, pull requests or other branches.

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the packages to nuget.org (only honored on release/* branches)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    uses: ./.github/workflows/native.yml

  pack:
    needs: native
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.nbgv.outputs.NuGetPackageVersion }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nerdbank.GitVersioning needs the history to compute the version height

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - uses: actions/download-artifact@v4
        with:
          pattern: native-audio-*
          merge-multiple: true
          path: native/sharplight_audio/out

      # Sharplight's own FFmpeg libraries (native.yml) that Sharplight.Video copies next to its output and packs.
      - uses: actions/download-artifact@v4
        with:
          pattern: native-ffmpeg-*
          merge-multiple: true
          path: native/ffmpeg/out

      - name: Version
        id: nbgv
        uses: dotnet/nbgv@v0.4
        with:
          setAllVars: true

      - name: Restore
        run: dotnet restore Sharplight.slnx

      # SharplightRequireFfmpeg: the build fails instead of packing Sharplight.Video without the FFmpeg libraries of a platform.
      - name: Build
        run: dotnet build Sharplight.slnx -c Release --no-restore -p:SharplightRequireFfmpeg=true

      - name: Pack
        run: dotnet pack Sharplight.slnx -c Release --no-build -o artifacts/packages

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ steps.nbgv.outputs.NuGetPackageVersion }}
          path: artifacts/packages
          if-no-files-found: error

  publish:
    needs: pack
    # Release branches only: never main, tags or pull requests.
    if: >-
      startsWith(github.ref, 'refs/heads/release/') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write # nuget.org trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages-${{ needs.pack.outputs.version }}
          path: packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: nuget.org login (trusted publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      # nuget.org rejects packages above 250 MB (Sharplight.Cuda.Blas carries cuBLASLt, ~375 MB): those are skipped with a
      # warning instead of failing the push of every package after them (docs/cuda.md: the Blas package is for other feeds).
      - name: Push
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          limit=$((250 * 1024 * 1024))
          for package in packages/*.nupkg; do
            if [ "$(stat -c %s "$package")" -gt "$limit" ]; then
              echo "::warning::$(basename "$package") exceeds nuget.org's 250 MB limit; not pushed"
              continue
            fi
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

  # Prerelease feed: green main builds go to GitHub Packages (https://nuget.pkg.github.com/<owner>/index.json) so that
  # consumers can test against main without waiting for a release (docs/releasing.md, "Prerelease feed").
  prerelease:
    needs: pack
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: prerelease-feed
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read # wait for the CI run of the same commit
      packages: write # push to the owner's GitHub Packages feed with GITHUB_TOKEN
    steps:
      # Only a commit whose CI run (ci.yml, same push) succeeded is published. A cancelled run (a newer push superseded it)
      # publishes nothing; the newer push publishes its own packages.
      - name: Wait for CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 160); do
            run="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&per_page=1" \
              --jq '.workflow_runs[0] | "\(.status) \(.conclusion)"' || true)"
            status="${run%% *}"
            conclusion="${run#* }"
            if [ "$status" = "completed" ]; then
              echo "CI for $SHA: $conclusion"
              if [ "$conclusion" = "success" ]; then
                echo "publish=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$conclusion" = "cancelled" ]; then
                echo "publish=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              exit 1
            fi
            sleep 60
          done
          echo "CI for $SHA did not finish in time"
          exit 1

      - uses: actions/download-artifact@v4
        if: steps.ci.outputs.publish == 'true'
        with:
          name: packages-${{ needs.pack.outputs.version }}
          path: packages

      - uses: actions/setup-dotnet@v4
        if: steps.ci.outputs.publish == 'true'
        with:
          dotnet-version: '11.0.x'

      # GitHub Packages has no symbol server: only the .nupkg files are pushed.
      - name: Push
        if: steps.ci.outputs.publish == 'true'
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key "${{ github.token }}"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --skip-duplicate
          --no-symbols
